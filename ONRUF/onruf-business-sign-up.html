<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ONRUF – Business Sign-Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6r0zE1x4rOzT9kZf3g==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="assets/css/onruf-sign-up.css">
    <link rel="stylesheet" href="assets/css/onruf-business-sign-up.css">
</head>
<body class="signup-body business-body">
    <div class="signup-shell">
        <section class="signup-panel business-panel" aria-live="polite">
            <div class="language-toggle" role="tablist" aria-label="Language toggle">
                <button type="button" class="lang-btn" data-lang="ar" role="tab" aria-selected="false">AR</button>
                <button type="button" class="lang-btn active" data-lang="en" role="tab" aria-selected="true">EN</button>
            </div>

            <header>
                <h1 class="step-heading">welcome</h1>
                <p class="step-subheading">Sign Up</p>
            </header>

            <form id="businessSignupForm" class="signup-form business-form" novalidate action="javascript:void(0);">
                <div class="input-field">
                    <label class="input-label required" for="companyNameArabic">Company name arabic</label>
                    <div class="input-shell">
                        <i class="fa-solid fa-building input-icon" aria-hidden="true"></i>
                        <input type="text" id="companyNameArabic" placeholder="Company name arabic" autocomplete="organization" required>
                    </div>
                </div>
                <div class="input-field">
                    <label class="input-label required" for="companyNameEnglish">Company name English</label>
                    <div class="input-shell">
                        <i class="fa-solid fa-building-columns input-icon" aria-hidden="true"></i>
                        <input type="text" id="companyNameEnglish" placeholder="Company name English" autocomplete="organization" required>
                    </div>
                </div>
                <div class="input-field">
                    <label class="input-label" for="businessUserName">User Name</label>
                    <div class="input-shell">
                        <i class="fa-solid fa-user input-icon" aria-hidden="true"></i>
                        <input type="text" id="businessUserName" placeholder="User Name" autocomplete="nickname" required>
                    </div>
                </div>
                <div class="input-field">
                    <label class="input-label required" for="registrationNumber">Business Registration Number</label>
                    <div class="input-shell">
                        <i class="fa-solid fa-id-card input-icon" aria-hidden="true"></i>
                        <input type="text" id="registrationNumber" placeholder="Business Registration Number" autocomplete="off" required>
                    </div>
                </div>
                <div class="input-field">
                    <label class="input-label required" for="businessEmail">Email</label>
                    <div class="input-shell">
                        <i class="fa-solid fa-envelope input-icon" aria-hidden="true"></i>
                        <input type="email" id="businessEmail" placeholder="Email" autocomplete="email" required>
                    </div>
                </div>

                <div class="logo-upload">
                    <label class="input-label" for="businessLogo">Business Logo</label>
                    <div class="logo-upload__control">
                        <input type="file" id="businessLogo" accept="image/*" hidden>
                        <button type="button" class="logo-upload__btn" id="businessLogoBtn">
                            <i class="fa-solid fa-cloud-arrow-up" aria-hidden="true"></i>
                            <span>Upload Image</span>
                        </button>
                        <span class="logo-upload__hint" id="businessLogoHint">No file selected</span>
                    </div>
                </div>

                <div class="input-field">
                    <label class="input-label" for="businessWebsite">Alternate Text</label>
                    <div class="input-shell">
                        <i class="fa-solid fa-globe input-icon" aria-hidden="true"></i>
                        <input type="url" id="businessWebsite" placeholder="https://www.website.com" autocomplete="url">
                    </div>
                </div>

                <div class="input-field">
                    <label class="input-label" for="facebookUrl">Facebook</label>
                    <div class="input-shell">
                        <i class="fa-brands fa-facebook input-icon" aria-hidden="true"></i>
                        <input type="url" id="facebookUrl" placeholder="https://www.facebook.com" autocomplete="url">
                    </div>
                </div>
                <div class="input-field">
                    <label class="input-label" for="instagramUrl">Instagram</label>
                    <div class="input-shell">
                        <i class="fa-brands fa-instagram input-icon" aria-hidden="true"></i>
                        <input type="url" id="instagramUrl" placeholder="https://www.instagram.com" autocomplete="url">
                    </div>
                </div>
                <div class="input-field">
                    <label class="input-label" for="twitterUrl">Twitter</label>
                    <div class="input-shell">
                        <i class="fa-brands fa-twitter input-icon" aria-hidden="true"></i>
                        <input type="url" id="twitterUrl" placeholder="https://www.twitter.com" autocomplete="url">
                    </div>
                </div>
                <div class="input-field">
                    <label class="input-label" for="youtubeUrl">YouTube</label>
                    <div class="input-shell">
                        <i class="fa-brands fa-youtube input-icon" aria-hidden="true"></i>
                        <input type="url" id="youtubeUrl" placeholder="https://www.youtube.com" autocomplete="url">
                    </div>
                </div>
                <div class="input-field">
                    <label class="input-label" for="linkedinUrl">LinkedIn</label>
                    <div class="input-shell">
                        <i class="fa-brands fa-linkedin input-icon" aria-hidden="true"></i>
                        <input type="url" id="linkedinUrl" placeholder="https://www.linkedin.com" autocomplete="url">
                    </div>
                </div>
                <div class="input-field">
                    <label class="input-label" for="snapchatUrl">Snapchat</label>
                    <div class="input-shell">
                        <i class="fa-brands fa-snapchat input-icon" aria-hidden="true"></i>
                        <input type="url" id="snapchatUrl" placeholder="https://www.snapchat.com" autocomplete="url">
                    </div>
                </div>
                <div class="input-field">
                    <label class="input-label" for="tiktokUrl">TikTok</label>
                    <div class="input-shell">
                        <i class="fa-brands fa-tiktok input-icon" aria-hidden="true"></i>
                        <input type="url" id="tiktokUrl" placeholder="https://www.tiktok.com" autocomplete="url">
                    </div>
                </div>

                <div class="input-field">
                    <label class="input-label required" for="detailRegNumber">Detail Registration Number</label>
                    <div class="input-shell">
                        <i class="fa-solid fa-file-lines input-icon" aria-hidden="true"></i>
                        <input type="text" id="detailRegNumber" placeholder="Detail Registration Number" autocomplete="off" required>
                    </div>
                </div>
                <div class="input-field">
                    <label class="input-label required" for="expiryDate">Expiry Date</label>
                    <div class="input-shell">
                        <i class="fa-solid fa-calendar input-icon" aria-hidden="true"></i>
                        <input type="date" id="expiryDate" placeholder="dd/mm/yyyy" required>
                    </div>
                </div>
                <div class="input-field">
                    <label class="input-label required" for="vatNumber">VAT Number</label>
                    <div class="input-shell">
                        <i class="fa-solid fa-percent input-icon" aria-hidden="true"></i>
                        <input type="text" id="vatNumber" placeholder="VAT Number" autocomplete="off" required>
                    </div>
                </div>
                <div class="input-field">
                    <label class="input-label" for="maroofUrl">Maroof profile</label>
                    <div class="input-shell">
                        <i class="fa-solid fa-link input-icon" aria-hidden="true"></i>
                        <input type="url" id="maroofUrl" placeholder="ex: https://maroof.sa/businesses/detail" autocomplete="url">
                    </div>
                </div>

                <fieldset class="doc-type-field" aria-labelledby="docTypeLabel">
                    <legend id="docTypeLabel" class="input-label">Registration Document Type</legend>
                    <div class="doc-type-options" role="radiogroup" aria-label="Registration document type">
                        <button type="button" class="doc-type-btn active" data-doc-type="commercial">
                            <span>Commercial Registration</span>
                        </button>
                        <button type="button" class="doc-type-btn" data-doc-type="freelance">
                            <span>Freelance License</span>
                        </button>
                    </div>
                    <input type="hidden" id="docTypeValue" value="commercial">
                </fieldset>

                <div class="input-field">
                    <label class="input-label required" for="businessCountry">Select Country</label>
                    <div class="input-shell">
                        <i class="fa-solid fa-earth-asia input-icon" aria-hidden="true"></i>
                        <select id="businessCountry" required></select>
                    </div>
                </div>
                <div class="input-field">
                    <label class="input-label required" for="businessRegion">Select Region</label>
                    <div class="input-shell">
                        <i class="fa-solid fa-map input-icon" aria-hidden="true"></i>
                        <select id="businessRegion" required></select>
                    </div>
                </div>
                <div class="input-field">
                    <label class="input-label required" for="businessCity">Select City</label>
                    <div class="input-shell">
                        <i class="fa-solid fa-location-dot input-icon" aria-hidden="true"></i>
                        <select id="businessCity" required></select>
                    </div>
                </div>
                <div class="input-field">
                    <label class="input-label required" for="businessDistrict">District Name</label>
                    <div class="input-shell">
                        <i class="fa-solid fa-city input-icon" aria-hidden="true"></i>
                        <input type="text" id="businessDistrict" placeholder="District Name" required>
                    </div>
                </div>
                <div class="input-field">
                    <label class="input-label required" for="businessStreet">Street Number and Name</label>
                    <div class="input-shell">
                        <i class="fa-solid fa-road input-icon" aria-hidden="true"></i>
                        <input type="text" id="businessStreet" placeholder="Street Number and Name" required>
                    </div>
                </div>
                <div class="input-field">
                    <label class="input-label required" for="businessZip">Zip Code</label>
                    <div class="input-shell">
                        <i class="fa-solid fa-inbox input-icon" aria-hidden="true"></i>
                        <input type="text" id="businessZip" placeholder="Zip Code" required>
                    </div>
                </div>

                <div class="switch-row business-switch">
                    <label for="tradeToggle">Trade for 15 years</label>
                    <span class="switch">
                        <input type="checkbox" id="tradeToggle">
                        <span class="slider" aria-hidden="true"></span>
                    </span>
                </div>

                <div class="certificate-upload">
                    <label class="input-label required" for="certificateUpload">Upload Certificates</label>
                    <div class="certificate-upload__control">
                        <input type="file" id="certificateUpload" multiple hidden required>
                        <button type="button" class="certificate-upload__btn" id="certificateUploadBtn">Choose files</button>
                        <span class="certificate-upload__hint" id="certificateUploadHint">No file chosen</span>
                    </div>
                </div>

                <div class="business-actions">
                    <button type="submit" class="primary-btn">Submit</button>
                    <a href="onruf-platform.html" class="back-link">
                        <i class="fa-solid fa-arrow-left"></i>
                        <span>Back to Home</span>
                    </a>
                </div>
            </form>
        </section>

        <aside class="signup-hero business-hero" aria-label="ONRUF business overview">
            <div class="hero-content">
                <div class="hero-logo">
                    <span class="hero-mark">ON</span>
                    <span class="hero-word">RUF</span>
                </div>
                <h2 class="hero-title">Grow Your Business With ONRUF</h2>
                <p class="hero-copy">Register your business account and reach thousands of customers. Sell your products easily and securely with ONRUF.</p>
                <div class="hero-shape" aria-hidden="true"></div>
            </div>
        </aside>
    </div>

    <div class="signup-toast" id="businessToast" role="status" aria-live="polite"></div>

    <script src="assets/js/onruf-business-sign-up.js" defer></script>
</body>
</html>
